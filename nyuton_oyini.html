<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nyuton qonunlari bellashuvi</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#667085;--bd:#d9dfec;--p1:#2563eb;--p2:#e11d48;--ok:#16a34a;--no:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2133;--tx:#eef1f8;--mu:#9aa4bb;--bd:#2b3550;--p1:#60a5fa;--p2:#fb7185;--ok:#4ade80;--no:#f87171}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#1a2133;--tx:#eef1f8;--mu:#9aa4bb;--bd:#2b3550;--p1:#60a5fa;--p2:#fb7185;--ok:#4ade80;--no:#f87171}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;text-align:center;margin:8px 0}
.sub{text-align:center;color:var(--mu);font-size:.9rem;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
input{width:100%;padding:12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;margin:6px 0 12px}
label{font-weight:600;font-size:.9rem}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:var(--p1);color:#fff;font-weight:700;font-size:1.05rem}
.sc{display:flex;gap:10px}
.pl{flex:1;border:2px solid var(--bd);border-radius:14px;padding:10px;background:var(--card);transition:.2s}
.pl.a{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.pl .n{font-size:.85rem;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .s{font-size:1.8rem;font-weight:800;color:var(--c)}
.bar{height:8px;border-radius:5px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);width:0;transition:width .4s}
.turn{text-align:center;font-weight:700;margin:12px 0 8px}
.q{font-size:1.15rem;font-weight:700;line-height:1.4}
.o{display:block;width:100%;text-align:left;padding:13px;margin-top:9px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--bg))}
.o.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 20%,var(--bg))}
.fb{text-align:center;font-weight:700;min-height:1.5em;margin:10px 0}
.hide{display:none}
.md{flex:1;padding:11px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-weight:700}
.md.on{border-color:var(--p1);background:color-mix(in srgb,var(--p1) 18%,var(--bg))}
.r{display:flex;align-items:center;gap:8px;margin-top:9px;padding:6px;border:2px solid var(--bd);border-radius:12px;background:var(--bg)}
.r span{flex:1;font-size:.95rem}
.r.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--bg))}
.pb{width:46px;height:46px;border-radius:10px;border:0;color:#fff;font-weight:800;font-size:1rem;flex:none}
.pb:disabled{opacity:.3}
.legend{text-align:center;font-size:.85rem;color:var(--mu);margin-top:4px}
.win{text-align:center;font-size:1.6rem;font-weight:800;margin:10px 0}
</style>
</head>
<body>
<div class="w">
<h1>⚖️ Nyuton qonunlari bellashuvi</h1>
<div class="sub">7-sinf · Kuchlar · Muvozanat · 100 ball birinchi yigʻgan gʻolib</div>

<div id="s1" class="card">
<label>1-oʻquvchi ismi</label><input id="n1" placeholder="Masalan: Aziz" maxlength="16">
<label>2-oʻquvchi ismi</label><input id="n2" placeholder="Masalan: Madina" maxlength="16">
<label>Oʻyin rejimi</label>
<div style="display:flex;gap:8px;margin:6px 0 8px"><button class="md" id="md0" onclick="setMode(0)">Navbat bilan</button><button class="md on" id="md1" onclick="setMode(1)">Bir vaqtda ⚡</button></div>
<p class="sub" id="mdt" style="margin:0 0 12px"></p>
<button class="btn" onclick="start()">Oʻyinni boshlash</button>
</div>

<div id="s2" class="hide">
<div class="sc">
<div class="pl" id="p0" style="--c:var(--p1)"><div class="n" id="m0"></div><div class="s" id="c0">0</div><div class="bar" style="--c:var(--p1)"><i id="b0"></i></div></div>
<div class="pl" id="p1" style="--c:var(--p2)"><div class="n" id="m1"></div><div class="s" id="c1">0</div><div class="bar" style="--c:var(--p2)"><i id="b1"></i></div></div>
</div>
<div class="turn" id="turn"></div>
<div class="card"><div class="q" id="q"></div><div id="opts"></div></div>
<div class="fb" id="fb"></div>
<div class="bar" id="tm" style="--c:var(--mu);margin-top:4px"><i id="tb" style="width:100%;transition:none"></i></div>
</div>

<div id="s3" class="card hide">
<div class="win" id="win"></div>
<p class="sub" id="fin"></p>
<button class="btn" onclick="again()">Qayta oʻynash</button>
</div>
</div>

<script>
var Q=[
["Nyutonning birinchi qonuni qanday ataladi?","Inersiya qonuni","Butun olam tortishish qonuni","Arximed qonuni","Ta’sir va aks ta’sir qonuni"],
["Nyutonning ikkinchi qonuni formulasi qaysi?","F = m·a","F = m/a","F = m + a","F = a/m"],
["Nyutonning uchinchi qonuniga koʻra ta’sir kuchi va aks ta’sir kuchi...","teng va qarama-qarshi yoʻnalgan","teng va bir tomonga yoʻnalgan","bir-birini yoʻqotadi","faqat tinch jismlarda mavjud"],
["Kuchning birligi qaysi?","Nyuton (N)","Joul (J)","Vatt (W)","Paskal (Pa)"],
["Bir tomonga yoʻnalgan 3 N va 4 N kuchlarning teng ta’sir etuvchisi qancha?","7 N","1 N","12 N","0 N"],
["Qarama-qarshi yoʻnalgan 8 N va 5 N kuchlarning teng ta’sir etuvchisi qancha?","3 N","13 N","40 N","0 N"],
["Muvozanatlashgan kuchlar ta’siridagi jism...","tinch turadi yoki toʻgʻri chiziqli tekis harakatlanadi","tezlanish bilan harakatlanadi","doim tinch turadi","tezligi ortib boradi"],
["Qarama-qarshi yoʻnalgan 10 N va 10 N kuchlarning teng ta’sir etuvchisi?","0 N","20 N","100 N","10 N"],
["Avtobus keskin tormozlanganda yoʻlovchilar oldinga egiladi. Sababi nima?","Inersiya","Ishqalanish","Elastiklik kuchi","Magnit kuchi"],
["Inersiya nima?","Jismning oʻz tezligini saqlash xususiyati","Jismning massasi","Jismning ogʻirligi","Jismning hajmi"],
["Massasi 2 kg jism 3 m/s² tezlanish olishi uchun qancha kuch kerak?","6 N","1,5 N","5 N","0,6 N"],
["10 N kuch massasi 5 kg jismga qancha tezlanish beradi?","2 m/s²","50 m/s²","5 m/s²","0,5 m/s²"],
["Kuch oʻzgarmasa, jism massasi ortsa tezlanish...","kamayadi","ortadi","oʻzgarmaydi","nolga teng boʻladi"],
["Raketaning uchishi Nyutonning qaysi qonuniga asoslangan?","Uchinchi qonun","Birinchi qonun","Ikkinchi qonun","Hech qaysisiga"],
["Arqon tortishda ikki jamoa teng kuch bilan tortsa, arqon...","qimirlamaydi","chap tomonga yuradi","oʻng tomonga yuradi","uziladi"],
["Kuch qanday fizik kattalik?","Vektor kattalik","Skalyar kattalik","Doimiy kattalik","Birlik"],
["Stol ustida turgan kitobning ogʻirlik kuchini qaysi kuch muvozanatlaydi?","Tayanch reaksiya kuchi","Ishqalanish kuchi","Magnit kuchi","Havo qarshiligi"],
["Kuchni oʻlchaydigan asbob qaysi?","Dinamometr","Termometr","Barometr","Spidometr"],
["Bir yoʻnalishdagi 6 N va 9 N kuchlarning teng ta’sir etuvchisi?","15 N","3 N","54 N","1,5 N"],
["Qarama-qarshi yoʻnalgan 15 N va 20 N kuchlarning teng ta’sir etuvchisi qanday?","5 N, kattaroq kuch tomonga","35 N, kichik kuch tomonga","5 N, kichik kuch tomonga","0 N"],
["Qayiqchi eshkak bilan suvni orqaga itaradi, qayiq oldinga yuradi. Bu qaysi qonun?","Uchinchi qonun","Birinchi qonun","Ikkinchi qonun","Gravitatsiya qonuni"],
["Jism tezligi oʻzgarishi uchun nima zarur?","Kuch ta’siri","Vaqt oʻtishi","Massaning ortishi","Hech narsa"],
["Jism toʻgʻri chiziqli tekis harakatlanyapti. Unga ta’sir etuvchi kuchlarning teng ta’sir etuvchisi?","Nolga teng","Doimiy va nolga teng emas","Ortib boradi","Kamayib boradi"],
["Ta’sir va aks ta’sir kuchlari qanday jismlarga qoʻyilgan?","Turli jismlarga","Bir jismga","Faqat yerga","Faqat harakatlanuvchi jismga"],
["Ta’sir va aks ta’sir kuchlarining modullari...","teng","ta’sir kuchi katta","aks ta’sir kuchi katta","turlicha"],
["Massasi 4 kg jismga 20 N kuch ta’sir qilsa, tezlanishi qancha?","5 m/s²","80 m/s²","16 m/s²","0,2 m/s²"],
["Sakraganimizda yerdan itarilamiz va yuqoriga koʻtarilamiz. Bu qaysi qonun?","Uchinchi qonun","Birinchi qonun","Ikkinchi qonun","Arximed qonuni"],
["Ishqalanish kuchi harakatga qanday ta’sir qiladi?","Harakatga qarshi yoʻnalgan boʻladi","Harakat bilan bir yoʻnalgan boʻladi","Harakatga ta’sir qilmaydi","Faqat tezlikni oshiradi"],
["Tepilgan toʻp bir muncha vaqtdan soʻng toʻxtaydi. Sababi nima?","Ishqalanish va havo qarshiligi","Inersiya yoʻqolgani","Kuch ta’sir qilmagani","Toʻpning ogʻirligi yoʻqolgani"],
["Bir tomonga yoʻnalgan 5 N va 5 N kuchlarning teng ta’sir etuvchisi?","10 N","0 N","25 N","5 N"],
["Quyidagilardan qaysi biri muvozanatlashgan kuchlarga misol?","Stol ustida tinch turgan kitob","Pastga tushayotgan tosh","Tormozlanayotgan avtomobil","Tepilgan futbol toʻpi"],
["Massasi 10 kg jismga 50 N kuch ta’sir qilsa, tezlanishi qancha?","5 m/s²","500 m/s²","0,2 m/s²","40 m/s²"],
["Massasi 3 kg jism 4 m/s² tezlanish bilan harakatlanmoqda. Unga ta’sir etuvchi kuch qancha?","12 N","0,75 N","7 N","1,33 N"],
["24 N kuch jismga 6 m/s² tezlanish bersa, jism massasi qancha?","4 kg","144 kg","18 kg","0,25 kg"],
["Bir tomonga yoʻnalgan 12 N va 18 N kuchlarning teng ta’sir etuvchisi qancha?","30 N","6 N","216 N","1,5 N"],
["Qarama-qarshi yoʻnalgan 25 N va 10 N kuchlarning teng ta’sir etuvchisi qancha?","15 N","35 N","250 N","2,5 N"],
["Teng ta’sir etuvchi kuch nolga teng boʻlmasa, jism...","tezlanish oladi","tinch turadi","tekis harakatlanadi","harakatini toʻxtatadi"],
["Uchta harakat qonunini yaratgan olim kim?","Isaak Nyuton","Galileo Galiley","Albert Eynshteyn","Arximed"],
["Tinch turgan jismga kuch ta’sir qilmasa, u...","tinch holatini saqlaydi","tezlashadi","sekin harakatlana boshlaydi","pastga tushadi"],
["Massasi katta jismning inersiyasi qanday boʻladi?","Kattaroq","Kichikroq","Nolga teng","Massaga bogʻliq emas"],
["Tezlanish yoʻnalishi qaysi kuch yoʻnalishi bilan mos tushadi?","Teng ta’sir etuvchi kuch","Ishqalanish kuchi","Ogʻirlik kuchi","Hech qaysi"],
["1 N kuch nimaga teng?","1 kg massali jismga 1 m/s² tezlanish beradigan kuch","1 kg jismning ogʻirligi","1 m/s tezlik","10 kg massali jism ogʻirligi"],
["Dinamometr qaysi kuchning ta’siriga asoslangan?","Elastiklik kuchi","Magnit kuchi","Ishqalanish kuchi","Arximed kuchi"],
["Ot aravani tortadi. Aravaning otga ta’sir kuchi qanday?","Teng va qarama-qarshi yoʻnalgan","Nolga teng","Kichikroq","Kattaroq"],
["Muz ustida sirpanish oson. Sababi nima?","Ishqalanish kuchi kichik","Ishqalanish kuchi katta","Inersiya yoʻq","Massa kam"],
["Avtomobil tekis harakatlanmoqda, dvigatel kuchi 800 N. Qarshilik kuchi qancha?","800 N","0 N","1600 N","400 N"],
["Qarama-qarshi kuchlardan F₁ > F₂ boʻlsa, jism qaysi tomonga tezlanish oladi?","Kattaroq kuch tomonga","Kichikroq kuch tomonga","Tezlanish olmaydi","Kuchlarga perpendikulyar"],
["Muvozanatlashgan kuchlarning belgisi qaysi?","Moduli teng, yoʻnalishi qarama-qarshi, bir jismga qoʻyilgan","Moduli turlicha, yoʻnalishi bir xil","Turli jismlarga qoʻyilgan","Faqat bir tomonga yoʻnalgan"],
["Fizikada kuch qaysi harf bilan belgilanadi?","F","K","S","M"],
["Massaning birligi qaysi?","Kilogramm (kg)","Nyuton (N)","Metr (m)","Sekund (s)"],
["Tezlanishning birligi qaysi?","m/s²","m/s","N","kg"],
["Parashyutchi tekis tushayotganda ogʻirlik kuchi va havo qarshiligi...","teng va qarama-qarshi","ogʻirlik kuchi katta","qarshilik kuchi katta","mavjud emas"],
["Qoʻldan qoʻyib yuborilgan tosh pastga tushadi. Sababi nima?","Yerning tortish kuchi","Inersiya","Ishqalanish kuchi","Elastiklik kuchi"],
["Devorni itarganimizda devor ham bizni itaradi. Bu qaysi qonun?","Ta’sir va aks ta’sir qonuni","Inersiya qonuni","Ikkinchi qonun","Ishqalanish qonuni"],
["Dasturxonni tez tortib olsak, idishlar joyida qoladi. Sababi nima?","Inersiya","Ishqalanish yoʻqligi","Idishlarning yengilligi","Magnit kuchi"],
["Bir tomonga 5 N va 7 N, qarama-qarshi tomonga 4 N kuch ta’sir qilsa, teng ta’sir etuvchi qancha?","8 N","16 N","2 N","0 N"],
["Kuch oʻzgarmas, jism massasi 2 marta ortsa, tezlanish...","2 marta kamayadi","2 marta ortadi","oʻzgarmaydi","4 marta kamayadi"],
["Massa oʻzgarmas, kuch 2 marta ortsa, tezlanish...","2 marta ortadi","2 marta kamayadi","oʻzgarmaydi","4 marta ortadi"],
["Nyutonning ikkinchi qonuni qaysi kattaliklarni bogʻlaydi?","Kuch, massa va tezlanish","Tezlik, vaqt va yoʻl","Bosim, hajm va harorat","Ish, energiya va quvvat"],
["Tekis harakatlanayotgan poyezd toʻsatdan tormozlansa, stol ustidagi olma...","oldinga dumalaydi","orqaga dumalaydi","joyida qoladi","yuqoriga sakraydi"]
];
var names=["",""],sc=[0,0],t=0,deck=[],cur=null,lock=false,mode=1,out=[false,false],tmr=null,nxt=null,LIM=15000;
function setMode(m){mode=m;$("md0").classList.toggle("on",m===0);$("md1").classList.toggle("on",m===1);
 $("mdt").textContent=m?"Ikkala oʻquvchi bir vaqtda javob beradi. Birinchi toʻgʻri javob bergan 10 ball oladi. Xato qilgan savoldan chiqadi. Vaqt: 15 soniya.":"Oʻquvchilar navbat bilan javob beradi. Har toʻgʻri javob — 10 ball."}
setMode(1);
function $(i){return document.getElementById(i)}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}
function show(id){["s1","s2","s3"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}
function start(){
 names=[$("n1").value.trim()||"1-oʻquvchi",$("n2").value.trim()||"2-oʻquvchi"];
 sc=[0,0];t=Math.round(Math.random());deck=shuf(Q);
 $("m0").textContent=names[0];$("m1").textContent=names[1];
 show("s2");upd();ask();
}
function upd(){
 for(var i=0;i<2;i++){$("c"+i).textContent=sc[i];$("b"+i).style.width=Math.min(sc[i],100)+"%";$("p"+i).classList.toggle("a",mode===0&&i===t)}
 $("turn").textContent=mode?"⚡ Kim birinchi toʻgʻri javob beradi?":"🎯 Navbat: "+names[t];
}
function ask(){
 if(!deck.length)deck=shuf(Q);
 clearTimeout(nxt);clearInterval(tmr);out=[false,false];
 cur=deck.pop();lock=false;
 $("q").textContent=cur[0];$("fb").textContent="";$("fb").style.color="";$("tm").style.display=mode?"block":"none";
 var h=$("opts");h.innerHTML="";
 shuf(cur.slice(1)).forEach(function(o){
  if(!mode){
   var b=document.createElement("button");b.className="o";b.textContent=o;
   b.onclick=function(){pick(b,o)};h.appendChild(b);
  }else{
   var r=document.createElement("div");r.className="r";r.dataset.a=o;
   var s=document.createElement("span");s.textContent=o;
   var b0=document.createElement("button"),b1=document.createElement("button");
   b0.className="pb";b1.className="pb";b0.textContent="1";b1.textContent="2";
   b0.style.background="var(--p1)";b1.style.background="var(--p2)";
   b0.onclick=function(){claim(0,o,r)};b1.onclick=function(){claim(1,o,r)};
   r.appendChild(b0);r.appendChild(s);r.appendChild(b1);h.appendChild(r);
  }
 });
 upd();
 if(mode){
  $("fb").innerHTML="";var lg=document.createElement("div");lg.className="legend";
  lg.textContent="🔵 "+names[0]+" — chap tugma  ·  🔴 "+names[1]+" — oʻng tugma";$("fb").appendChild(lg);
  var t0=Date.now();
  tmr=setInterval(function(){
   var left=1-(Date.now()-t0)/LIM;
   $("tb").style.width=Math.max(left,0)*100+"%";
   if(left<=0){clearInterval(tmr);lock=true;mark();say("⏰ Vaqt tugadi! Ball berilmadi.","var(--no)");after()}
  },100);
 }
}
function say(m,c){$("fb").textContent=m;$("fb").style.color=c}
function mark(){Array.prototype.forEach.call($("opts").children,function(r){if(r.dataset.a===cur[1])r.classList.add("ok");Array.prototype.forEach.call(r.querySelectorAll("button"),function(b){b.disabled=true})})}
function claim(p,o,r){
 if(lock||out[p])return;
 if(o===cur[1]){
  lock=true;clearInterval(tmr);sc[p]+=10;t=p;mark();
  say("✅ "+names[p]+" birinchi boʻlib toʻgʻri javob berdi! +10 ball","var(--ok)");upd();after();
 }else{
  out[p]=true;
  Array.prototype.forEach.call($("opts").querySelectorAll(".pb"),function(b){if(b.textContent===String(p+1))b.disabled=true});
  r.style.borderColor="var(--no)";
  if(out[0]&&out[1]){lock=true;clearInterval(tmr);mark();say("❌ Ikkalasi ham xato qildi. Ball berilmadi.","var(--no)");after()}
  else say("❌ "+names[p]+" xato qildi va bu savoldan chiqdi!","var(--no)");
 }
}
function after(){
 if(sc[0]>=100||sc[1]>=100){nxt=setTimeout(end,1800);return}
 nxt=setTimeout(next,2200);
}
function pick(b,o){
 if(lock)return;lock=true;
 var right=cur[1],ok=o===right;
 Array.prototype.forEach.call($("opts").children,function(x){if(x.textContent===right)x.classList.add("ok")});
 if(ok){sc[t]+=10;$("fb").textContent="✅ Toʻgʻri! +10 ball";$("fb").style.color="var(--ok)"}
 else{b.classList.add("no");$("fb").textContent="❌ Notoʻgʻri. 0 ball";$("fb").style.color="var(--no)"}
 upd();
 after();
}
function next(){t=1-t;ask()}
function end(){
 show("s3");
 $("win").textContent="🏆 Gʻolib: "+names[t]+"!";
 $("fin").textContent=names[0]+": "+sc[0]+" ball · "+names[1]+": "+sc[1]+" ball";
}
function again(){show("s1")}
</script>
</body>
</html>
