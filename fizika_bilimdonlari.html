function startGame(){let n=+$('teamCount').value;teams=Array.from({length:n},(_,i)=>$('team'+i).value.trim()||`${i+1}-jamoa`);scores=teams.map(()=>0);turn=0;used=new Set();let topics=shuffle(TOPICS).slice(0,5);chosen=topics.map(topic=>({topic,qs:[10,20,30,40,50].map(points=>shuffle(BANK.filter(q=>q.topic===topic&&q.points===points))[0])}));$('setup').classList.add('hidden');$('end').classList.add('hidden');$('game').classList.remove('hidden');render()}
function render(){ $('scores').innerHTML='';teams.forEach((t,i)=>{let d=document.createElement('div');d.className='score'+(i===turn?' active':'');d.innerHTML=`<b>${esc(t)}</b><strong>${scores[i]}</strong><span class="small">ball</span>`;$('scores').appendChild(d)});$('turn').textContent=`🎯 Navbat: ${teams[turn]}`;$('board').innerHTML='';chosen.forEach((c,ci)=>{let h=document.createElement('div');h.className='colhead';h.textContent=c.topic;$('board').appendChild(h)});[10,20,30,40,50].forEach((p,ri)=>chosen.forEach((c,ci)=>{let index=ci*5+ri;let b=document.createElement('button');b.className='card'+(used.has(index)?' used':'');b.textContent=used.has(index)?'✓':p;b.disabled=used.has(index);b.setAttribute('aria-label',`${c.topic}, ${p} ball`);b.onclick=()=>openQuestion(index,ci,ri);$('board').appendChild(b)}));if(used.size===25)finish()}
function openQuestion(index,ci,ri){current={index,ci,ri,q:chosen[ci].qs[ri]};answered=false;$('qtag').textContent=`${current.q.topic} · ${current.q.points} BALL`;$('qtext').textContent=current.q.q;$('result').innerHTML='';$('result').className='';$('close').classList.add('hidden');$('answers').innerHTML='';current.q.opts.forEach((opt,i)=>{let b=document.createElement('button');b.className='answer';b.textContent='ABCD'[i]+'. '+opt;b.onclick=()=>checkAnswer(i);$('answers').appendChild(b)});$('modal').classList.remove('hidden')}
function checkAnswer(i){if(answered)return;answered=true;let ok=i===current.q.a;[...$('answers').children].forEach((b,j)=>{b.disabled=true;if(j===current.q.a)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});if(ok){scores[turn]+=current.q.points;$('result').textContent=`✓ TO‘G‘RI! +${current.q.points} ball`;$('result').className='result good'}else{$('result').textContent='✕ NOTO‘G‘RI! Ball berilmadi.';$('result').className='result bad'}used.add(current.index);$('close').classList.remove('hidden');}
$('close').onclick=()=>{$('modal').classList.add('hidden');turn=(turn+1)%teams.length;render()};$('next').onclick=()=>{if($('modal').classList.contains('hidden')){turn=(turn+1)%teams.length;render()}};
function finish(){ $('game').classList.add('hidden');$('end').classList.remove('hidden');let max=Math.max(...scores),w=teams.filter((t,i)=>scores[i]===max);$('winnerText').innerHTML=`<h3>${w.map(esc).join(' va ')} ${w.length>1?'durang':'g‘olib'}!</h3><p>Natija: ${max} ball</p>`+teams.map((t,i)=>`<p>${esc(t)} — <b>${scores[i]} ball</b></p>`).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('start').onclick=startGame;$('restart').onclick=()=>{if(confirm('Joriy o‘yin natijalari bekor qilinadi. Yangi o‘yin boshlansinmi?')){$('game').classList.add('hidden');$('setup').classList.remove('hidden')}};$('again').onclick=()=>{$('end').classList.add('hidden');$('setup').classList.remove('hidden')};
</script></body></html>
